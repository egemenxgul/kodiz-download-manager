name: KodizDownloadManager
options:
  bundleIdPrefix: dev.kodiz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  KodizKit:
    path: Packages/KodizKit

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    ARCHS: "$(ARCHS_STANDARD)"

targets:
  Kodiz Download Manager:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    info:
      path: App/Resources/Info.plist
    entitlements:
      path: App/Resources/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kodiz.DownloadManager
        PRODUCT_NAME: "Kodiz Download Manager"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KodizKit
        product: KodizEngine
      - package: KodizKit
        product: KodizStore
      - package: KodizKit
        product: KodizBridgeProtocol
      - package: KodizKit
        product: KodizMedia
      - package: KodizKit
        product: KodizSystem
      - target: NativeHost
        embed: true
        subpath: Contents/Helpers
      - target: KodizSafari
        embed: true
        subpath: Contents/PlugIns

  NativeHost:
    type: tool
    platform: macOS
    sources:
      - path: NativeHost/Sources
    entitlements:
      path: NativeHost/NativeHost.entitlements
    settings:
      base:
        PRODUCT_NAME: kodiz-nmh
        PRODUCT_BUNDLE_IDENTIFIER: dev.kodiz.NativeHost
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: KodizKit
        product: KodizBridgeProtocol

  KodizSafari:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension/Sources
    info:
      path: SafariExtension/Info.plist
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kodiz.DownloadManager.SafariExtension
        PRODUCT_NAME: KodizSafari
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: KodizKit
        product: KodizBridgeProtocol
