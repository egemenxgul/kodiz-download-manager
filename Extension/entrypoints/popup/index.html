<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kodiz Download Manager</title>
  <style>
    :root {
      --bg: #1e1e24;
      --card: #282830;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #3f3f4e;
      --success: #10b981;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--success);
      background: rgba(16, 185, 129, 0.15);
      padding: 3px 8px;
      border-radius: 12px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #4b5563; transition: .3s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(16px); }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }

    .media-section {
      margin-top: 14px;
    }
    .media-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .media-list {
      max-height: 140px;
      overflow-y: auto;
    }
    .media-item {
      background: var(--card);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .media-url {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .btn-small {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-small:hover { background: rgba(59, 130, 246, 0.4); }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⬇ Kodiz</div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>Bağlı</span>
    </div>
  </div>

  <div class="toggle-row">
    <span>İndirmeleri Yakala</span>
    <label class="switch">
      <input type="checkbox" id="toggle-intercept" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button id="download-current-page" class="btn">
    🎬 Bu Sayfadaki Videoyu İndir
  </button>

  <div class="media-section" id="media-container" style="display: none;">
    <div class="media-title">Algılanan Akışlar & Medyalar</div>
    <div class="media-list" id="media-list"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
