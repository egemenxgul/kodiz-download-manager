name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Extension/package-lock.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run KodizKit Swift Tests
        run: |
          swift test --package-path Packages/KodizKit --scratch-path /tmp/kodiz-build

      - name: Build kdm-cli
        run: |
          swift build --package-path Tools/kdm-cli --scratch-path /tmp/kodiz-cli-build

      - name: Build TestServer
        run: |
          swift build --package-path Tools/TestServer --scratch-path /tmp/kodiz-testserver-build

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build macOS App with Xcodebuild
        run: |
          xcodebuild -project KodizDownloadManager.xcodeproj \
                     -scheme "Kodiz Download Manager" \
                     -derivedDataPath /tmp/kodiz-dd \
                     build CODE_SIGNING_ALLOWED=NO

      - name: Test & Build Browser Extensions
        run: |
          cd Extension
          npm ci
          npm run compile
          npm test
          npx wxt build -b chrome
          npx wxt build -b firefox
          npx wxt build -b safari
